<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Vinted Alerts</title>
</head>
<body>
    <h2>Vinted Discord Alerts</h2>

    <h3>Configuration du serveur</h3>

    <label for="serverUrl">Adresse de réception :</label>
    <input
        id="serverUrl"
        type="url"
        value="https://kiqnfbglxp.apps.bot-hosting.cloud/annonce"
    >

    <br><br>

    <label for="apiKey">Clé API :</label>
    <input
        id="apiKey"
        type="password"
        placeholder="Colle ta clé API ici"
    >

    <br><br>

    <button id="sauvegarder">Enregistrer la configuration</button>

    <hr>

    <button id="scanner">Scanner les annonces</button>
    <button id="envoyer" disabled>Envoyer à Discord</button>

    <div id="resultats"></div>
    <p id="statut">En attente...</p>

    <script src="popup.js"></script>
</body>
</html>
